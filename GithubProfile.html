<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GitHub Profile Finder</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 50px auto;
        }

        /* Search Section */

        .search {
            background-color: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
            text-align: center;
        }

        .search h1 {
            margin-top: 0;
        }

        input {
            width: 70%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 12px 20px;
            margin-left: 5px;
            background-color: #24292e;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #444;
        }

        /* Profile Section */

        .profile {
            margin-top: 30px;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
            text-align: center;
        }

        .profile img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
        }

        .profile h2 {
            margin-bottom: 5px;
        }

        .bio {
            color: #555;
        }

        .info {
            text-align: left;
            margin-top: 20px;
        }

        .info p {
            font-size: 17px;
        }

        .github-link {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #24292e;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .error {
            color: red;
            margin-top: 15px;
        }

    </style>

</head>


<body>

    <div class="container">


        <!-- Search Section -->

        <div class="search">

            <h1>GitHub Profile Finder</h1>

            <input
                type="text"
                id="usernameInput"
                placeholder="Enter GitHub username"
            >

            <button onclick="getProfile()">
                Fetch Profile
            </button>

            <p id="error" class="error"></p>

        </div>


        <!-- Profile Section -->

        <div class="profile">

            <img
                id="avatar"
                src=""
                alt="GitHub Profile"
            >

            <h2 id="name">
                GitHub Profile
            </h2>

            <p id="bio" class="bio">
                Enter a GitHub username above
            </p>


            <div class="info">

                <p>
                    👤 Username:
                    <span id="username"></span>
                </p>

                <p>
                    📍 Location:
                    <span id="location"></span>
                </p>

                <p>
                    📦 Public Repositories:
                    <span id="repos"></span>
                </p>

                <p>
                    👥 Followers:
                    <span id="followers"></span>
                </p>

                <p>
                    👥 Following:
                    <span id="following"></span>
                </p>

            </div>


            <a
                id="githubLink"
                class="github-link"
                href="#"
                target="_blank"
            >
                Visit GitHub Profile
            </a>

        </div>

    </div>


    <script>

        async function getProfile() {

            // Get username from input

            const username =
                document.getElementById(
                    "usernameInput"
                ).value.trim();


            // Check empty input

            if (username === "") {

                document.getElementById("error").innerText =
                    "Please enter a GitHub username";

                return;
            }


            // Clear previous error

            document.getElementById("error").innerText =
                "";


            // GitHub API URL

            const URL =
                `https://api.github.com/users/${username}`;


            try {

                console.log("Fetching:", URL);


                const response =
                    await fetch(URL);


                console.log(
                    "Response:",
                    response
                );


                // Check API response

                if (!response.ok) {

                    if (response.status === 404) {

                        throw new Error(
                            "GitHub user not found"
                        );

                    }

                    if (response.status === 403) {

                        throw new Error(
                            "GitHub API rate limit exceeded"
                        );

                    }

                    throw new Error(
                        `Error: ${response.status}`
                    );
                }


                // Convert response to JSON

                const data =
                    await response.json();


                console.log(
                    "GitHub Data:",
                    data
                );


                // Display profile image

                document.getElementById("avatar").src =
                    data.avatar_url;


                // Display name

                document.getElementById("name").innerText =
                    data.name || "No Name";


                // Display bio

                document.getElementById("bio").innerText =
                    data.bio || "No Bio Available";


                // Display username

                document.getElementById("username").innerText =
                    data.login;


                // Display location

                document.getElementById("location").innerText =
                    data.location || "Not Available";


                // Display repositories count

                document.getElementById("repos").innerText =
                    data.public_repos;


                // Display followers

                document.getElementById("followers").innerText =
                    data.followers;


                // Display following

                document.getElementById("following").innerText =
                    data.following;


                // GitHub profile link

                document.getElementById("githubLink").href =
                    data.html_url;

            }


            catch (error) {

                console.error(
                    "Error:",
                    error
                );


                document.getElementById("error").innerText =
                    error.message;

            }

        }

    </script>

</body>

</html>
